<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>

    <!-- Floating / Pulsing Keyframes -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-10px) scale(1.03); opacity: 0.95; }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
        50% { transform: translateY(-14px) scale(1.05); opacity: 0.9; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .sweep {
        transform-origin: 1020px 160px;
        animation: radarSweep 14s linear infinite;
      }
      .floating-node1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node2 {
        animation: floatFast 8s ease-in-out infinite 1s;
      }
      .floating-node3 {
        animation: floatSlow 7s ease-in-out infinite 2s;
      }
      .glow-sphere {
        transform-origin: 1020px 160px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .flow-line {
        stroke-dasharray: 12, 12;
        animation: dataFlow 8s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        font-weight: 600;
        font-size: 11px;
      }
      .desc-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        fill: #94a3b8;
        font-size: 14px;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="1200" height="320" rx="16" fill="url(#cyberGrid)" />

  <!-- Background Dynamic Radar & Mesh (Strictly in Background) -->
  <g opacity="0.45">
    <!-- Radar Concentric Circles -->
    <circle cx="1020" cy="160" r="50" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="1020" cy="160" r="95" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4, 4" />
    <circle cx="1020" cy="160" r="135" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="1020" cy="160" r="70" class="glow-sphere" fill="url(#glowGrad)" />

    <!-- Animated Radar Sweeper -->
    <g class="sweep">
      <line x1="1020" y1="160" x2="1155" y2="160" stroke="url(#accentGrad)" stroke-width="2" />
      <polygon points="1020,160 1155,140 1155,160" fill="url(#accentGrad)" opacity="0.25" />
    </g>

    <!-- Dynamic Data Streams in Background -->
    <path class="flow-line" d="M 400,280 C 600,280 750,220 920,200" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    <path class="flow-line" d="M 480,40 C 650,40 800,100 950,130" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.4" />
  </g>

  <!-- Animated Floating Pills / Nodes (Safely positioned on right flank, never overlapping title) -->
  <g class="floating-node1">
    <g transform="translate(860, 48)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" fill-opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="34" y="21" class="badge-text" fill="#e0f2fe">TLS / JA4 Impersonation</text>
    </g>
  </g>

  <g class="floating-node2">
    <g transform="translate(950, 230)">
      <rect width="170" height="34" rx="17" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" fill-opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#a855f7" />
      <text x="34" y="21" class="badge-text" fill="#f3e8ff">Stealth CDP Automation</text>
    </g>
  </g>

  <g class="floating-node3">
    <g transform="translate(760, 195)">
      <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2" fill-opacity="0.9" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="34" y="21" class="badge-text" fill="#d1fae5">Anti-Bot Bypass 🛡️</text>
    </g>
  </g>

  <!-- Foreground Main Content: Title, Subtitle, Highlights -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 46)">
      <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" class="badge-text" fill="#38bdf8">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="112" class="title-text" font-size="36">
      Web Scraping &amp; Anti-Bot
    </text>
    <text x="0" y="154" class="title-text" font-size="36" fill="url(#accentGrad)">
      Bypassing Ecosystem
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="196" class="desc-text">
      Enterprise SaaS Unblockers • Anti-Detect Browsers • TLS / JA3 / JA4 Spoofers
    </text>
    <text x="0" y="218" class="desc-text">
      Driverless CDP Automation • Residential Proxy Routing • Open-Source Frameworks
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="120" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="60" y="16" text-anchor="middle" class="badge-text" fill="#94a3b8">Cloudflare WAF</text>

      <rect x="130" y="0" width="100" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="180" y="16" text-anchor="middle" class="badge-text" fill="#94a3b8">DataDome</text>

      <rect x="240" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="305" y="16" text-anchor="middle" class="badge-text" fill="#94a3b8">Akamai Bot Mgr</text>

      <rect x="380" y="0" width="115" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="437" y="16" text-anchor="middle" class="badge-text" fill="#94a3b8">PerimeterX</text>
    </g>
  </g>
</svg>
